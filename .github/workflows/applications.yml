# Fabrique toutes les applications à installer et les publie dans « Releases » du dépôt :
#   - Windows : NARX-Foot-Manager-Setup-<version>.exe
#   - Mac     : .dmg (puce Apple « arm64 » et Intel « x64 »)
#   - Android : NARX-Foot-Manager.apk (aussi publié sur le site : /telecharger/NARX-Foot-Manager.apk)
# Lancement : onglet Actions → « Applications (Windows, Mac, Android) » → Run workflow.
name: Applications (Windows, Mac, Android)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: npm ci
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: desktop/dist/*.exe, retention-days: 7 }

  mac:
    runs-on: macos-latest
    defaults: { run: { working-directory: desktop } }
    env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: npm ci
      - name: Construire (puce Apple et Intel)
        run: |
          npx electron-builder --mac --dir --x64 --publish never
          npx electron-builder --mac --dir --arm64 --publish never
      - name: Signature ad hoc
        run: |
          codesign --force --deep --sign - "dist/mac/NARX Foot Manager.app"
          codesign --force --deep --sign - "dist/mac-arm64/NARX Foot Manager.app"
      - name: Fabriquer les .dmg
        run: |
          npx electron-builder --mac dmg --x64 --prepackaged "dist/mac/NARX Foot Manager.app" --publish never
          npx electron-builder --mac dmg --arm64 --prepackaged "dist/mac-arm64/NARX Foot Manager.app" --publish never
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: desktop/dist/*.dmg, retention-days: 7 }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Construire l'APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../android-build.log
          cp app/build/outputs/apk/release/app-release.apk ../NARX-Foot-Manager.apk
      - name: Journal en cas d'échec (branche journaux-ci)
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan journaux-ci; git rm -rfq --cached . ; tail -c 200000 android-build.log > android-build.txt
          git add android-build.txt; git commit -qm "Journal Android $GITHUB_RUN_ID"; git push -f origin journaux-ci
      - uses: actions/upload-artifact@v4
        with: { name: android, path: NARX-Foot-Manager.apk, retention-days: 7 }

  publier:
    needs: [windows, mac, android]
    runs-on: ubuntu-latest
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: fichiers, merge-multiple: true }
      - name: Créer la version dans Releases
        run: |
          V=$(node -p "require('./desktop/package.json').version")
          gh release delete "v$V" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$V" fichiers/* --title "NARX Foot Manager $V" --notes-file docs/INSTALLATION.md
      - name: Mettre l'APK sur le site
        run: |
          mkdir -p web/public/telecharger && cp fichiers/NARX-Foot-Manager.apk web/public/telecharger/
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add web/public/telecharger/NARX-Foot-Manager.apk
          git commit -qm "APK Android" && git push || echo "APK inchangé"
      - name: Publier sur Firebase
        env: { SA: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' }
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          PID=$(node -p "require('./.firebaserc').projects.default")
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx -y firebase-tools@13 deploy --only hosting --project "$PID" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
