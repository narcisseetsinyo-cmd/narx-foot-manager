# Fabrique les installateurs Windows (.exe) et Mac (.dmg et .zip, puce Apple et Intel).
# Lancement : onglet Actions → « Applications Windows et Mac » → Run workflow,
# ou automatiquement en créant une étiquette v* (ex. v3.10.1).
# Les fichiers produits se téléchargent en bas de la page du lancement (rubrique Artifacts).
name: Applications Windows et Mac
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: NARX-Foot-Manager-Windows
          path: desktop/dist/*.exe
          retention-days: 30
  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Construire les applications (puce Apple et Intel)
        run: |
          npx electron-builder --mac --dir --x64 --publish never
          npx electron-builder --mac --dir --arm64 --publish never
      - name: Signature ad hoc (sinon macOS déclare l'application « endommagée »)
        run: |
          codesign --force --deep --sign - "dist/mac/NARX Foot Manager.app"
          codesign --force --deep --sign - "dist/mac-arm64/NARX Foot Manager.app"
      - name: Fabriquer les .dmg et .zip
        run: |
          npx electron-builder --mac dmg zip --x64 --prepackaged "dist/mac/NARX Foot Manager.app" --publish never
          npx electron-builder --mac dmg zip --arm64 --prepackaged "dist/mac-arm64/NARX Foot Manager.app" --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: NARX-Foot-Manager-Mac
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
          retention-days: 30
