<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NARX Foot Manager</title>
<style>@font-face{font-family:'Bricolage Grotesque';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/bricolage-grotesque-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Bricolage Grotesque';font-weight:800;font-style:normal;font-display:swap;src:url(fonts/bricolage-grotesque-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Manrope';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/manrope-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Manrope';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/manrope-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Manrope';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/manrope-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Manrope';font-weight:800;font-style:normal;font-display:swap;src:url(fonts/manrope-latin-800-normal.woff2) format('woff2')}

:root{
  --night:#0A1330; --deep:#010C34; --royal:#0A3FA8; --royal2:#123E9C; --gold:#3D7BF7; --gold2:#9CC0FF;
  --ice:#E6ECFF; --muted:#A9B8E3; --line:rgba(169,184,227,.22); --card:#0A2470; --card2:#16234F;
  --ok:#3DDC97; --bad:#FF6B6B; --warn:#3D7BF7;
  --bg:var(--deep); --text:#fff;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{--bg:var(--deep)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
@media (max-width:600px){.hm{display:none}}
td .row span{white-space:nowrap}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Manrope","Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.45;
  background-image:radial-gradient(1200px 600px at 110% -10%,rgba(61,123,247,.65),transparent 60%),radial-gradient(800px 500px at -20% 110%,rgba(61,123,247,.35),transparent 60%);background-attachment:fixed}
h1,h2,h3,.cond{font-family:var(--fd);letter-spacing:.2px}
h1{font-size:28px;margin:0;font-weight:700}
h2{font-size:24px;margin:0 0 4px;font-weight:700}
h3{font-size:19px;margin:0;font-weight:600}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
img{max-width:100%}
a{color:var(--gold2)}
.app{display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr;align-content:start;min-height:100vh}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(10,19,48,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top img{width:42px;height:42px}
.top .t1{font-family:var(--fd);font-weight:700;font-size:21px;line-height:1}
.top .t2{font-size:12px;color:var(--muted)}
.mode{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.mode.live{color:var(--ok);border-color:rgba(61,220,151,.4)}
main{padding:18px 16px 110px;max-width:1120px;width:100%;margin:0 auto;min-width:0;overflow-x:hidden}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;background:rgba(10,19,48,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);cursor:pointer}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--gold)}
@media (min-width:900px){
  .app{grid-template-columns:230px 1fr;grid-template-rows:auto 1fr;align-items:start}
  .nav{position:sticky;top:0;height:100vh;grid-template-columns:1fr;grid-auto-rows:min-content;align-content:start;padding:90px 12px 12px;border-top:0;border-right:1px solid var(--line);grid-row:1/3}
  .nav button{flex-direction:row;justify-content:flex-start;gap:12px;font-size:16px;padding:12px 14px;border-radius:10px}
  .nav button[aria-current="page"]{background:rgba(61,123,247,.12)}
  .top{grid-column:2}
  main{grid-column:2;padding-bottom:40px}
}
/* generic */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--gold);color:var(--night);display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{background:var(--gold2)}
.btn.ghost{background:transparent;color:var(--ice);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(255,107,107,.45)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:16px}
.grid{display:grid;gap:14px}
.empty{border:1px dashed var(--line);border-radius:16px;padding:28px;text-align:center;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;background:rgba(169,184,227,.14);color:var(--ice)}
.chip.ok{background:rgba(61,220,151,.15);color:var(--ok)}
.chip.bad{background:rgba(255,107,107,.15);color:var(--bad)}
.chip.gold{background:rgba(61,123,247,.18);color:var(--gold2)}
.seg{display:flex;gap:4px;background:rgba(10,19,48,.6);padding:4px;border-radius:12px;border:1px solid var(--line);overflow-x:auto;margin:12px 0 16px}
.seg button{flex:1 0 auto;border:0;background:none;padding:8px 14px;border-radius:9px;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--royal);color:#fff}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
/* avatars */
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--royal2);display:grid;place-items:center;font-family:var(--fd);font-weight:700;color:var(--gold2);flex:none;overflow:hidden;border:2px solid rgba(61,123,247,.5)}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:96px;height:96px;font-size:32px}
.crest{width:52px;height:52px;border-radius:14px;background:#fff1;display:grid;place-items:center;overflow:hidden;flex:none;font-family:var(--fd);font-weight:700;font-size:18px;color:var(--night)}
.crest img{width:100%;height:100%;object-fit:contain;background:#fff}
.crest.sm{width:30px;height:30px;border-radius:8px;font-size:12px}
.crest.lg{width:110px;height:110px;border-radius:24px;font-size:34px}
/* clubs */
.clubs{grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.clubcard{display:flex;gap:14px;align-items:center;text-align:left;cursor:pointer;color:inherit;border:1px solid var(--line);background:linear-gradient(180deg,var(--card2),var(--card));border-radius:16px;padding:14px;width:100%}
.clubcard:hover{border-color:var(--gold)}
.clubcard .nm{font-weight:600;font-size:16px;line-height:1.2}
.sigle{font-family:var(--fd);font-weight:700;font-size:15px;color:var(--gold2)}
.people{grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.person{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:rgba(10,19,48,.45);border:1px solid var(--line)}
.person.emptyp{border-style:dashed;color:var(--muted)}
.role{font-size:12px;color:var(--gold2);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:600;color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap}
td{padding:8px 6px;border-bottom:1px solid rgba(169,184,227,.1);vertical-align:middle}
td.n,th.n{text-align:center}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
tr.q td{background:rgba(61,123,247,.07)}
.pts{font-family:var(--fd);font-weight:700;font-size:18px;color:var(--gold2)}
/* draw */
.pots{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.poule h3{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.letter{font-family:var(--fd);font-size:40px;font-weight:700;color:var(--gold);line-height:1}
.slot{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;background:rgba(10,19,48,.5);border:1px solid var(--line);margin-bottom:8px;min-height:50px;cursor:default;width:100%;text-align:left;color:inherit}
.slot.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(61,123,247,.35)}
.slot .code{font-family:var(--fd);font-weight:700;color:var(--muted);width:24px}
.slot.reveal{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.7);opacity:0;background:var(--gold)}60%{background:rgba(61,123,247,.45)}100%{transform:scale(1);opacity:1}}
.drum{display:flex;align-items:center;justify-content:center;gap:16px;min-height:120px;font-family:var(--fd);font-size:34px;font-weight:700;text-align:center}
/* matches */
.mcard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);cursor:pointer;width:100%;color:inherit;text-align:left}
.mcard:hover{border-color:var(--gold)}
.mcard .tm{display:flex;align-items:center;gap:8px;min-width:0}
.mcard .tm.r{justify-content:flex-end;text-align:right}
.mcard .tm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.score{font-family:var(--fd);font-weight:700;font-size:26px;background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:2px 12px;min-width:84px;text-align:center;letter-spacing:2px}
.score.live{color:var(--gold2)}
.meta{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px;flex-wrap:wrap}
.phase{margin:22px 0 10px;color:var(--gold2);font-family:var(--fd);font-size:20px;font-weight:600}
/* stats */
.podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.leader{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:linear-gradient(135deg,rgba(61,123,247,.22),rgba(61,123,247,.3));border:1px solid rgba(61,123,247,.4)}
.big{font-family:var(--fd);font-size:40px;font-weight:700;color:var(--gold);line-height:1;margin-left:auto}
/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(1,8,30,.72);display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{background:linear-gradient(180deg,#16234F,#0A2470);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px));border:1px solid var(--line)}
@media (min-width:700px){.modal{align-items:center;padding:20px}.sheet{border-radius:20px}}
.sheet header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.x{background:none;border:0;color:var(--muted);font-size:28px;line-height:1;cursor:pointer;padding:4px 8px}
form .f{display:grid;gap:5px;margin-bottom:12px}
form label{font-size:13px;color:var(--muted);font-weight:500}
input[type=text],input[type=tel],input[type=date],input[type=time],input[type=number],select{background:rgba(10,19,48,.65);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;color:#fff}
input:focus,select:focus{border-color:var(--gold);outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo-pick{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.photo-pick input{display:none}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--gold);color:var(--night);padding:10px 18px;border-radius:12px;font-weight:600;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.ev{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(169,184,227,.12)}
.evico{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.evico.but{background:#fff;color:var(--night)}
.evico.cj{background:var(--gold);color:var(--night)}
.evico.rd{background:var(--bad);color:#fff}
.notice{padding:10px 14px;border-radius:12px;background:rgba(61,123,247,.12);border:1px solid rgba(61,123,247,.35);color:var(--gold2);font-size:14px;margin-bottom:14px}
.back{background:none;border:0;color:var(--muted);cursor:pointer;padding:0;margin-bottom:10px;font-size:14px}
.back:hover{color:var(--gold)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pcard{display:flex;gap:14px;align-items:flex-start;text-align:left;color:inherit;border:1px solid var(--line);background:linear-gradient(180deg,var(--card2),var(--card));border-radius:16px;padding:14px;width:100%}
button.pcard{cursor:pointer}button.pcard:hover{border-color:var(--gold)!important}
.plogo{flex:none;border-radius:14px;background:#fff;display:grid;place-items:center;overflow:hidden;color:var(--night);font-family:var(--fd);font-size:22px}
.plogo img{width:100%;height:100%;object-fit:contain}
.licgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.lic{aspect-ratio:6/4;background:linear-gradient(135deg,#0A1330,#0A3FA8 60%,#123E9C);border-radius:10px;overflow:hidden;color:#fff;display:grid;grid-template-rows:15% 1fr 12%;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.lic-top{background:rgba(10,19,48,.55);border-bottom:2px solid #3D7BF7;display:flex;align-items:center;gap:8px;padding:0 8px;min-width:0}
.lic-t{font-family:var(--fd);font-weight:700;color:#3D7BF7;font-size:17px}
.lic-s{font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lic-club{margin-left:auto;height:80%;aspect-ratio:1;border-radius:5px;display:grid;place-items:center;overflow:hidden;font-family:var(--fd);font-weight:700;font-size:10px;color:#0A1330;flex:none}
.lic-club img{width:100%;height:100%;object-fit:contain;background:#fff}
.lic-body{display:flex;gap:9px;padding:6px 9px;min-height:0;align-items:center}
.lic-ph{height:100%;aspect-ratio:1;border-radius:7px;border:2px solid #3D7BF7;background:#16234F;display:grid;place-items:center;overflow:hidden;font-family:var(--fd);font-weight:700;font-size:26px;color:#3D7BF7;flex:none}
.lic-ph img{width:100%;height:100%;object-fit:cover;object-position:center 25%}
.lic-id{min-width:0}
.lic-n{font-family:var(--fd);font-weight:700;font-size:18px;color:#3D7BF7;line-height:1.05;overflow-wrap:anywhere}
.lic-p{font-weight:600;font-size:12px;line-height:1.2;overflow-wrap:anywhere}
.lic-r{display:inline-block;margin:3px 0;padding:1px 7px;border-radius:9px;font-size:9px;font-weight:700;color:#9CC0FF;border:1px solid #3D7BF7;background:rgba(61,123,247,.16)}
.lic-d{font-size:9.5px;line-height:1.35;overflow-wrap:anywhere}.lic-d b{color:#3D7BF7;font-weight:600}
.lic-bot{background:rgba(10,19,48,.6);border-top:2px solid #3D7BF7;display:flex;align-items:center;justify-content:space-between;padding:0 9px;font-size:9px}
.lic-bot b{font-family:var(--fd);color:#3D7BF7;font-size:13px}
#asfab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;box-shadow:0 8px 28px rgba(0,0,0,.45);border-radius:24px;padding:12px 18px}
@media (min-width:900px){#asfab{bottom:24px}}

/* ===== Thème « Nuit bleue » : fond marine dégradé, bleu vif lumineux, vert et rouge en accents, police Manrope ===== */
:root{
  --deep:#0A1330; --night:#0A1330; --bg:#0A1330;
  --royal:#3D7BF7; --royal2:#16234F;
  --gold:#3D7BF7;            /* couleur d'action principale */
  --gold2:#9CC0FF;           /* texte d'accent clair */
  --green:#8BC34A; --red:#D43B3B;
  --ice:#EEF3FF; --muted:#9AA9D1; --line:#22336B;
  --card:#0E1838; --card2:#111D42;
  --ok:#8BC34A; --bad:#FF6464; --warn:#F2B400;
  --glow:0 12px 34px -8px rgba(61,123,247,.65);
  --fx:"Manrope","Segoe UI",Roboto,Arial,sans-serif;
}
body{font-family:var(--fx);font-weight:500;font-size:15px;letter-spacing:-.005em;background-color:#0A1330;
  background-image:radial-gradient(900px 700px at 100% 100%,rgba(38,76,170,.55),transparent 65%),radial-gradient(700px 500px at 0% 0%,rgba(20,34,82,.9),transparent 70%),linear-gradient(180deg,#0B1533,#0E1A42);background-attachment:fixed}
h1,h2,h3,.cond{font-family:var(--fx);letter-spacing:-.035em}
h1{font-size:30px;font-weight:800;line-height:1.05}
h2{font-size:25px;font-weight:800;line-height:1.1}
h3{font-size:18px;font-weight:700;letter-spacing:-.02em}
a{color:var(--gold2)}
:focus-visible{outline:2px solid var(--gold2)}

/* en-tête */
.top{background:rgba(10,19,48,.88);border-bottom:1.5px solid var(--line);padding:12px 18px}
.top img{width:44px;height:44px;border-radius:50%!important}
.top .t1{font-family:var(--fx);font-weight:800;font-size:21px;letter-spacing:-.035em}
.top .t2{font-size:12.5px;color:var(--muted)}
.mode{border:1.5px solid var(--line);border-radius:14px;padding:6px 12px;font-weight:600;color:var(--ice)}
.mode.live{color:#0A1330;background:var(--green);border-color:var(--green)}

/* navigation */
.nav{background:rgba(10,19,48,.96);border-top:1.5px solid var(--line)}
.nav button{font-weight:600;color:var(--muted)}
.nav button[aria-current="page"]{color:#fff}
.nav button[aria-current="page"] svg{color:var(--royal)}
@media (min-width:900px){
  .nav{border-right:1.5px solid var(--line)}
  .nav button{border-radius:16px}
  .nav button[aria-current="page"]{background:rgba(61,123,247,.14);color:#fff}
}

/* boutons */
.btn{background:var(--royal);color:#fff;border-radius:18px;padding:12px 20px;font-weight:700;letter-spacing:-.01em;box-shadow:var(--glow);transition:transform .15s,box-shadow .15s,background .15s}
.btn:hover{background:#5A8FFA;transform:translateY(-1px)}
.btn.ghost{background:transparent;color:#fff;border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--royal);color:#fff;background:rgba(61,123,247,.08)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid rgba(255,100,100,.45);box-shadow:none}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:13px}
.btn:disabled{box-shadow:none}
#asfab{background:var(--green);color:#0A1330;border-radius:18px;box-shadow:0 12px 30px -8px rgba(139,195,74,.6);font-weight:800}
#asfab:hover{background:#9BD15A}

/* surfaces */
.panel,.clubcard,.mcard,.pcard{background:linear-gradient(180deg,rgba(18,30,68,.92),rgba(13,22,52,.92));border:1.5px solid var(--line);border-radius:24px}
.panel{padding:18px}
.clubcard:hover,.mcard:hover,button.pcard:hover{border-color:var(--royal)!important}
.empty{border:1.5px dashed var(--line);border-radius:24px}
.person,.slot{background:rgba(10,19,48,.6);border:1.5px solid var(--line);border-radius:16px}
.sheet{background:linear-gradient(180deg,#121E46,#0D1736);border:1.5px solid var(--line);border-radius:28px 28px 0 0}
@media (min-width:700px){.sheet{border-radius:28px}}
.modal{background:rgba(5,10,28,.75);backdrop-filter:blur(4px)}

/* onglets */
.seg{background:rgba(10,19,48,.7);border:1.5px solid var(--line);border-radius:18px;padding:5px}
.seg button{border-radius:14px;font-weight:700}
.seg button[aria-selected="true"]{background:var(--royal);color:#fff;box-shadow:var(--glow)}

/* puces et étiquettes */
.chip{border-radius:999px;padding:4px 11px;background:rgba(154,169,209,.14)}
.chip.ok{background:rgba(139,195,74,.16);color:var(--green)}
.chip.gold{background:rgba(61,123,247,.18);color:var(--gold2)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.notice{background:rgba(61,123,247,.12);border:1.5px solid rgba(61,123,247,.4);border-radius:16px;color:var(--ice)}

/* sur-titres : trait rouge + capitales espacées */
.phase{display:flex;align-items:center;gap:14px;font-family:var(--fx);font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold2);margin:26px 0 12px}
.phase::before{content:"";width:34px;height:2.5px;border-radius:2px;background:var(--red);flex:none}
th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}

/* chiffres */
.score,.big,.pts,.letter,.drum,.sigle,.slot .code,.av,.crest,.plogo{font-family:var(--fx);font-variant-numeric:tabular-nums}
.score{font-weight:800;letter-spacing:0;border-radius:14px;background:#0A1330;border:1.5px solid var(--line)}
.pts,.big,.letter{font-weight:800;letter-spacing:-.03em}
.pts{color:#fff}
.big,.letter{color:var(--royal)}
.sigle{font-weight:800;letter-spacing:.04em;font-size:13px;color:var(--gold2)}
tr.q td{background:rgba(61,123,247,.08)}

/* mises en avant : carte bleue pleine et lumineuse */
.leader{background:linear-gradient(160deg,#4A86FA,#3268E0);border:0;border-radius:24px;box-shadow:var(--glow)}
.leader .big{color:#fff}
.leader .muted{color:rgba(255,255,255,.8)}

/* avatars ronds rouges (initiales) */
.av{background:var(--red);color:#fff;border:0;font-weight:800}
.crest{border-radius:16px}

/* formulaires */
input[type=text],input[type=tel],input[type=date],input[type=time],input[type=number],input[type=email],input[type=password],select,textarea{background:#0B1430;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;color:#fff;font-family:var(--fx)}
input:focus,select:focus,textarea:focus{border-color:var(--royal);box-shadow:0 0 0 3px rgba(61,123,247,.25)}
form .f>label{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2)}
.toast{background:var(--royal);color:#fff;border-radius:16px;box-shadow:var(--glow)}
.evico.cj{background:#F2B400}
.slot.sel{border-color:var(--royal);box-shadow:0 0 0 3px rgba(61,123,247,.35)}
@keyframes pop{0%{transform:scale(.7);opacity:0;background:var(--royal)}60%{background:rgba(61,123,247,.45)}100%{transform:scale(1);opacity:1}}

/* ===== Compléments : police d'affichage Bricolage Grotesque, accueil, chiffres clés, connexion, licences ===== */
:root{--fd:"Bricolage Grotesque","Manrope","Segoe UI",Arial,sans-serif}
h1,h2{font-family:var(--fd);font-weight:800;letter-spacing:-.035em}
h1{font-size:34px;line-height:1.02}
h2{font-size:26px}
h3{font-family:var(--fx);font-weight:800}
.top .t1,.big,.letter,.pts,.score,.drum,.nm{font-family:var(--fd)}
.nm{font-weight:800;letter-spacing:-.02em}
.head{margin-bottom:20px}
.head .muted{margin-top:6px}
.eyebrow{display:flex;align-items:center;gap:14px;margin:0 0 14px;font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold2)}
.eyebrow::before{content:"";width:40px;height:3px;border-radius:2px;background:var(--red);flex:none}
.lead{font-size:18px;color:var(--ice);margin:12px 0 0;max-width:60ch}
/* accueil */
.hello{padding:14px 0 6px}
.hello h1{font-size:clamp(40px,6vw,64px);line-height:.98;letter-spacing:-.045em;max-width:16ch}
.hello h1 span,.authh span{color:var(--royal)}
.big-btn{padding:15px 24px;font-size:16px;border-radius:20px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:26px 0 8px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{border:1.5px solid var(--line);border-radius:26px;padding:20px 22px;background:linear-gradient(180deg,rgba(18,30,68,.6),rgba(13,22,52,.6));display:grid;gap:4px;min-width:0}
.kpi span{font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2)}
.kpi b{font-family:var(--fd);font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1.05;color:#fff}
.kpi small{font-size:15px;color:var(--muted)}
.kpi.hot{background:linear-gradient(160deg,#4A86FA,#3268E0);border-color:transparent;box-shadow:var(--glow)}
.kpi.hot span{color:rgba(255,255,255,.9)}.kpi.hot small{color:rgba(255,255,255,.85)}
/* connexion / bienvenue */
.authwrap{max-width:460px;margin:26px auto 40px;text-align:left}
.authbrand{display:flex;align-items:center;gap:16px;margin-bottom:28px}
.authbrand img{width:72px;height:72px;border-radius:50%;box-shadow:0 10px 30px -8px rgba(61,123,247,.6)}
.authbrand b{display:block;font-family:var(--fd);font-weight:800;font-size:28px;letter-spacing:-.035em;line-height:1}
.authbrand span{display:block;color:var(--muted);margin-top:6px}
.authh{font-size:clamp(36px,6vw,48px);line-height:1;letter-spacing:-.045em;margin:0 0 22px}
.authcard{padding:24px;border-radius:28px}
.authcard .btn{margin-top:6px;padding:15px}
/* licences : même rendu que l'export */
.lic{aspect-ratio:6/4;background:radial-gradient(90% 90% at 95% 95%,rgba(45,90,200,.55),transparent 70%),linear-gradient(180deg,#0B1533,#0E1A42);border:1.5px solid var(--line);border-radius:14px;overflow:hidden;color:#fff;display:grid;grid-template-rows:16% 1fr 15%;box-shadow:0 14px 34px -14px rgba(0,0,0,.7)}
.lic-top{background:none;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 10px;margin:0 0 0;min-width:0}
.lic-t{display:none}
.lic-s{display:flex;align-items:center;gap:7px;font-size:8.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lic-s::before{content:"";width:16px;height:2px;border-radius:2px;background:var(--red);flex:none}
.lic-club{margin-left:auto;height:72%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;overflow:hidden;font-family:var(--fx);font-weight:800;font-size:8.5px;color:#fff;flex:none}
.lic-club img{width:100%;height:100%;object-fit:contain;background:#fff}
.lic-body{display:flex;gap:10px;padding:7px 10px;min-height:0;align-items:center}
.lic-ph{height:100%;aspect-ratio:1;border-radius:10px;border:2px solid var(--royal);box-shadow:0 0 16px rgba(61,123,247,.45);background:#16234F;display:grid;place-items:center;overflow:hidden;flex:none}
.lic-ph i{font-style:normal;display:grid;place-items:center;width:48%;aspect-ratio:1;border-radius:50%;background:var(--red);font-weight:800;font-size:15px;color:#fff}
.lic-ph img{width:100%;height:100%;object-fit:cover;object-position:center 25%}
.lic-id{min-width:0}
.lic-n{font-family:var(--fd);font-weight:800;font-size:18px;letter-spacing:-.02em;color:#fff;line-height:1;overflow-wrap:anywhere}
.lic-p{font-family:var(--fd);font-weight:800;font-size:15px;color:var(--royal);line-height:1.1;overflow-wrap:anywhere}
.lic-r{display:inline-flex;align-items:center;gap:5px;margin:5px 0 4px;padding:2px 8px;border-radius:99px;font-size:9px;font-weight:700;color:var(--gold2);background:rgba(61,123,247,.18);border:0}
.lic-r::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--royal)}
.lic-d{font-size:9.5px;line-height:1.4;overflow-wrap:anywhere;font-weight:600}.lic-d b{color:var(--gold2);font-weight:700;font-size:7.5px;letter-spacing:.12em;text-transform:uppercase;margin-right:3px}
.lic-bot{background:none;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:9px}
.lic-bot small{display:block;font-size:6.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2);font-weight:700}
.lic-bot b{font-family:var(--fd);font-weight:800;color:#fff;font-size:12px;letter-spacing:-.01em}
.lic-v{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;background:rgba(139,195,74,.16);color:var(--green);font-weight:700}
.lic-v::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--green)}

.top .t1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:600px){.top .t1{font-size:18px}.top .t2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top>div{min-width:0}}
.podium .leader:not(:first-child){background:linear-gradient(180deg,rgba(18,30,68,.92),rgba(13,22,52,.92));border:1.5px solid var(--line);box-shadow:none}
.podium .leader:not(:first-child) .big{color:var(--royal)}
</style>
</head>
